<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Approvals test</title>
  </head>
  <body>
    <p id="total">Rs 0</p>
    <p id="total-label">Total</p>
    <p id="empty-state"></p>
    <p id="form-error" hidden></p>
    <form id="expense-form">
      <input id="amount" />
      <select id="category"></select>
      <input id="date" />
      <input id="note" />
      <input id="repeats-monthly" type="checkbox" />
    </form>
    <input id="search" />
    <select id="category-filter"></select>
    <ul id="expense-list"></ul>
    <div id="screen-root"></div>
    <pre id="out">running</pre>
    <script type="module">
      const out = document.getElementById("out");
      const lines = [];
      const check = (name, ok) => lines.push(`${ok ? "PASS" : "FAIL"} ${name}`);
      try {
        localStorage.clear();
        localStorage.setItem(
          "checklist",
          JSON.stringify({
            items: [
              { id: "rent", name: "Rent", dueDay: 1, expectedAmount: 15000, category: "Rent", order: 0 },
            ],
            months: {},
          })
        );
        localStorage.setItem(
          "expense-spaces",
          JSON.stringify({
            home: [],
            business: [
              {
                id: "biz-1",
                amount: 5000,
                category: "Rent",
                date: "2026-10-01",
                note: "Shop rent",
                repeatsMonthly: true,
                seriesId: "biz-1",
                lastAppliedMonth: "2026-10",
              },
            ],
          })
        );
        localStorage.setItem(
          "grocery-catalog",
          JSON.stringify({
            groups: [{ id: "staples", name: "Staples" }],
            items: [{ id: "atta", groupId: "staples", name: "Atta", hidden: false, lastPrice: 200 }],
          })
        );
        localStorage.setItem(
          "grocery-template",
          JSON.stringify({
            name: "My monthly grocery list",
            monthly: true,
            lines: [{ itemId: "atta", qty: 2 }],
          })
        );

        const { loadAll, state } = await import("./js/store.js");
        const { initStorage } = await import("./js/storage.js");
        const { registerApprovals, syncAutoApprovals, renderApprovals } = await import("./js/approvals.js");
        const { get } = await import("./js/storage.js");

        initStorage();
        loadAll();
        registerApprovals();
        syncAutoApprovals("2026-11-19");
        renderApprovals();

        const waiting = () => get("pendingApprovals").filter((item) => item.status === "waiting");
        const sources = waiting().map((item) => item.source);
        check("grocery pending", sources.includes("Auto: Monthly grocery list"));
        check("checklist pending", sources.includes("Auto: Checklist"));
        check("business pending", sources.includes("Auto: Recurring business expense"));
        check("home totals untouched", state.spaces.home.length === 0);
        check("only the original business expense", state.spaces.business.length === 1);
        check("screen lists three items", document.querySelectorAll("#approvals-list .expense").length === 3);
        check("auto label", document.querySelector(".auto-label")?.textContent === "Auto");
        check("approve all button", document.getElementById("approve-all") && !document.getElementById("approve-all").hidden);

        document.querySelector("[data-reject]").click();
        check("reject removes a row", document.querySelectorAll("#approvals-list .expense").length === 2);
        const rejected = get("pendingApprovals").filter((item) => item.status === "rejected");
        check("reject is remembered", rejected.length === 1);
        syncAutoApprovals("2026-11-19");
        renderApprovals();
        check(
          "rejected item stays away",
          !waiting().some((item) => item.sourceKey === rejected[0].sourceKey)
        );
        check("still nothing new in home totals", state.spaces.home.length === 0);

        const rent = waiting().find((item) => item.source === "Auto: Checklist");
        document.querySelector(`[data-approve="${rent.id}"]`).click();
        check("approve saves the expense", state.spaces.home.some((item) => item.note === "Rent" && item.amount === 15000));
        check("approved item leaves the list", !waiting().some((item) => item.id === rent.id));
        check("business repeat still not in November totals", !state.spaces.business.some((item) => item.date.startsWith("2026-11")));

        window.confirm = () => true;
        document.getElementById("approve-all").click();
        check("approve all saves the rest", waiting().length === 0);
        check("business November expense exists after approve all", state.spaces.business.some((item) => item.date.startsWith("2026-11") && item.note === "Shop rent"));
      } catch (error) {
        lines.push(`FAIL ${error.stack || error.message}`);
      }
      out.textContent = lines.join("\n");
    </script>
  </body>
</html>
