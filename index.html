<html lang="en"><head><meta charset="utf-8">

<title>My Expense Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@1,500&display=swap">
<style>
:root{--bg:#fffdf0;--ink:#3a3550;--mut:#7a758c;--line:#efe9d4;--pk:#ffdbe9;--pk2:#f6b8d1;--bl:#d9eaff;--bl2:#a9cdf5;--pi:#e0f3cf;--pi2:#a9dc8e;--ye:#fff5c2;--red:#d23f3f;--redbg:#ffe6e6;--acc:var(--pk2);--accl:var(--pk)}
body.b{--acc:var(--bl2);--accl:var(--bl)}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:fixed;top:0;left:0;right:0;height:58px;background:linear-gradient(90deg,var(--pi),var(--bl));display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:20;box-shadow:0 2px 8px rgba(120,110,150,.12)}
.top h1{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.burger{flex:none;width:46px;height:46px;border:0;background:none;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;cursor:pointer;position:relative}
.burger i{display:block;width:24px;height:3px;background:var(--ink);border-radius:2px}
.dot{position:absolute;top:6px;right:5px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 4px}
main{padding:74px 14px 100px;max-width:680px;margin:0 auto}
.ov{position:fixed;inset:0;background:rgba(58,53,80,.4);opacity:0;pointer-events:none;transition:.25s;z-index:30}
.ov.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;width:82%;max-width:310px;background:#fff;z-index:40;transform:translateX(-100%);transition:transform .28s;overflow-y:auto;padding-bottom:30px}
.drawer.on{transform:none}
.dh{background:linear-gradient(135deg,var(--ye),var(--pk) 50%,var(--bl));padding:30px 18px 18px}
.dh b{font-size:19px;display:block}.dh span{font-size:13px;color:var(--mut)}
.sec{padding:9px 18px;font-size:13px;font-weight:800;margin-top:10px}
.sec.h{background:var(--pk)}.sec.b{background:var(--bl)}.sec.t{background:var(--pi)}
.nav{display:flex;align-items:center;gap:12px;width:100%;padding:13px 18px;border:0;background:none;text-align:left;font-size:15.5px;cursor:pointer}
.nav .ic{width:24px;text-align:center;flex:none}
.nav .nm{flex:1;min-width:0}
.nav.act{background:var(--ye);font-weight:700}
.nav .bd{background:var(--red);color:#fff;border-radius:10px;font-size:12px;padding:1px 8px;font-weight:700}
.ph{background:var(--accl);border-radius:16px;padding:16px;margin-bottom:14px;border-left:6px solid var(--acc)}
.ph h2{font-size:21px;margin-bottom:4px;overflow-wrap:anywhere}
.ph p{color:var(--mut);font-size:14.5px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;border:1px solid var(--line)}
.card h3{font-size:16.5px;margin-bottom:6px;overflow-wrap:anywhere}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{border-radius:14px;padding:13px;background:var(--accl)}
.stat:nth-child(2n){background:var(--ye)}
.stat small{display:block;color:var(--mut);font-size:13px}
.stat b{font-size:19px;display:block;margin-top:2px;overflow-wrap:anywhere}
.full{grid-column:1/-1}
.good{color:#2e8b57}.bad{color:var(--red)}
label{display:block;font-size:14px;color:var(--mut);margin:12px 0 4px}
input,select,textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:#fffefa}
textarea{min-height:92px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.btn{display:block;width:100%;padding:13px 16px;border:0;border-radius:12px;background:var(--acc);font-weight:700;cursor:pointer;margin-top:14px}
.btn.sm{display:inline-block;width:auto;padding:8px 12px;margin:0;font-size:14px}
.btn.wa{background:var(--pi2)}.btn.ghost{background:var(--ye)}.btn.red{background:var(--redbg);color:var(--red)}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.rt{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rt .l{flex:1;min-width:0}.rt .l b{display:block;overflow-wrap:anywhere}.rt .l small{display:block;color:var(--mut);overflow-wrap:anywhere}
.rt .r{flex:none;max-width:42%;text-align:right;font-weight:700;overflow-wrap:anywhere}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.empty{text-align:center;color:var(--mut);padding:18px 8px}
.empty .btn{display:inline-block;width:auto;margin-top:10px;padding:9px 16px}
.bar{height:13px;background:var(--line);border-radius:8px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;border-radius:8px}
.alert{background:var(--redbg);border:1.5px solid #f4b4b4;border-radius:14px;padding:13px;margin-bottom:12px}
.alert b{color:var(--red);display:block;font-size:16px}
.news{background:var(--pi);border-radius:14px;padding:13px;margin-bottom:12px}
.chip{display:inline-block;font-size:12px;padding:3px 10px;border-radius:20px;background:var(--ye);font-weight:700;margin-top:4px}
.chip.ok{background:var(--pi)}.chip.no{background:var(--redbg);color:var(--red)}
.hint{font-size:13px;color:var(--mut);margin-top:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#auth{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;overflow-y:auto;background:radial-gradient(circle at 15% 15%,var(--pk) 0,transparent 45%),radial-gradient(circle at 85% 20%,var(--bl) 0,transparent 45%),radial-gradient(circle at 20% 90%,var(--pi) 0,transparent 50%),radial-gradient(circle at 90% 90%,var(--ye) 0,transparent 45%),#fffdf0}
.box{width:100%;max-width:380px;text-align:center}
.logo{font-size:52px}
.box h1{font-size:30px;line-height:1.15;margin:6px 0}
.tag{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin:10px 0 22px;font-weight:700}
.tag span{padding:5px 14px;border-radius:20px}
.tag .h1{background:var(--pk2)}.tag .b1{background:var(--bl2)}
.box .fm{background:rgba(255,255,255,.85);border-radius:20px;padding:6px 18px 20px;text-align:left}
.err{color:var(--red);font-size:14px;margin-top:8px;min-height:20px}
#auth .bl{position:absolute;border-radius:50%;opacity:.75;animation:fl 9s ease-in-out infinite;pointer-events:none}
@keyframes fl{50%{transform:translateY(-24px) scale(1.07)}}
@media(prefers-reduced-motion:reduce){#auth .bl{animation:none}}
.box{position:relative;z-index:1}
.bis{margin-bottom:22px;font-size:17px;color:var(--mut);margin-bottom:10px}
.lg{width:112px;height:112px;border-radius:50%;margin:0 auto 10px;display:block;object-fit:cover;background:#fff;box-shadow:0 8px 24px rgba(120,110,150,.28);border:4px solid #fff}
.lgf{display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;background:linear-gradient(90deg,var(--pk2) 50%,var(--bl2) 50%)}
.sub{color:var(--mut);font-size:14.5px;margin:-8px 4px 16px}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:25;border:0;border-radius:30px;padding:14px 18px;background:var(--acc);font-weight:700;box-shadow:0 4px 14px rgba(120,110,150,.35);display:none;cursor:pointer}
.mod{position:fixed;inset:0;z-index:60;background:rgba(58,53,80,.5);display:none;align-items:flex-end;justify-content:center}
.mod.on{display:flex}
.sheet{background:#fff;width:100%;max-width:680px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 18px 28px}
.pv{max-width:100%;max-height:190px;border-radius:12px;display:block;margin:10px auto}
#auth{background:radial-gradient(circle at 12% 10%,#ffe1ec 0,transparent 42%),radial-gradient(circle at 90% 14%,#dcebff 0,transparent 42%),radial-gradient(circle at 10% 92%,#e3f5d2 0,transparent 45%),radial-gradient(circle at 92% 90%,#fff3bf 0,transparent 42%),#fffdf6;overflow-x:hidden}
#auth::before{content:"";position:fixed;inset:12px;border:1.5px solid #d9b25f;pointer-events:none;z-index:2}
#auth::after{content:"";position:fixed;inset:18px;border:1px solid #ecd49b;pointer-events:none;z-index:2}
#auth .fx,#auth .mb{position:absolute;pointer-events:none;z-index:0}
#auth .fx{animation:sw 12s ease-in-out infinite alternate}
@keyframes sw{to{transform:rotate(7deg)}}
@media(prefers-reduced-motion:reduce){#auth .fx{animation:none}}
.arch{width:190px;height:212px;margin:4px auto 10px;border:2px solid #d9b25f;border-radius:95px 95px 18px 18px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.7);box-shadow:inset 0 0 0 5px #fff,inset 0 0 0 6px #ecd49b,0 8px 22px rgba(200,150,120,.2)}
#auth .lg{margin:0;width:128px;height:128px;border:3px solid #fff}
#auth .lgf{background:none;box-shadow:none;border:0;width:auto;height:auto;font-family:'Great Vibes',cursive;font-size:44px;color:#a4475c;font-weight:400}
.sc{font-family:'Great Vibes',cursive;font-size:38px!important;font-weight:400;color:#a4475c;line-height:1.1;margin:0!important}
.orn{display:flex;align-items:center;justify-content:center;gap:10px;margin:4px 0 2px;color:#d9b25f}
.orn i{display:block;width:70px;height:1.5px;background:linear-gradient(90deg,transparent,#d9b25f)}
.orn i:last-child{background:linear-gradient(270deg,transparent,#d9b25f)}
.kp{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:19px;color:#a4475c;margin-bottom:14px}
#auth .fm{background:rgba(255,255,255,.82);border:1px solid #ecd49b}
#auth .btn{background:linear-gradient(135deg,#f6b9cb,#ecc983)}
.dh{display:flex;gap:12px;align-items:center;cursor:pointer}
.av{width:54px;height:54px;border-radius:50%;background:#fff;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;flex:none;border:2px solid #fff;box-shadow:0 2px 8px rgba(120,110,150,.25)}
.av.big{width:112px;height:112px;margin:0 auto 12px;font-size:44px;background:var(--accl)}
.fg{text-align:center;margin-top:12px;font-size:12.5px}.fg a{color:var(--mut);text-decoration:underline}
@media print{.top,.drawer,.ov{display:none}}

<div id="auth"><svg class="mb" style="top:0;right:0;width:300px" viewBox="0 0 300 300" aria-hidden="true"><path d="M300 20C240 40 220 100 160 130S60 200 0 300" fill="none" stroke="#d9b25f" stroke-width="1.5" opacity=".7"/><path d="M300 50C250 70 235 120 180 150S90 215 40 300" fill="none" stroke="#f3b5c9" stroke-width="14" opacity=".35"/></svg><svg class="mb" style="bottom:0;left:0;transform:rotate(180deg);width:300px" viewBox="0 0 300 300" aria-hidden="true"><path d="M300 20C240 40 220 100 160 130S60 200 0 300" fill="none" stroke="#d9b25f" stroke-width="1.5" opacity=".7"/><path d="M300 50C250 70 235 120 180 150S90 215 40 300" fill="none" stroke="#f3b5c9" stroke-width="14" opacity=".35"/></svg><svg class="fx" style="--pf:#fcd5e1;--ps:#f0a3bd;left:-44px;top:-38px;width:200px" viewBox="-90 -90 180 180" aria-hidden="true"><use href="#lf" transform="rotate(35)"/><use href="#lf" transform="rotate(80) scale(.8)"/><use href="#fl"/></svg><svg class="fx" style="--pf:#d6e8ff;--ps:#9cc3f0;right:-40px;top:-30px;width:120px" viewBox="-90 -90 180 180" aria-hidden="true"><use href="#lf" transform="rotate(35)"/><use href="#lf" transform="rotate(80) scale(.8)"/><use href="#fl"/></svg><svg class="fx" style="--pf:#fff0b3;--ps:#e8cf6a;right:-44px;bottom:-40px;width:200px" viewBox="-90 -90 180 180" aria-hidden="true"><use href="#lf" transform="rotate(35)"/><use href="#lf" transform="rotate(80) scale(.8)"/><use href="#fl"/></svg><svg class="fx" style="--pf:#d9f0c4;--ps:#9fd183;left:-36px;bottom:-30px;width:120px" viewBox="-90 -90 180 180" aria-hidden="true"><use href="#lf" transform="rotate(35)"/><use href="#lf" transform="rotate(80) scale(.8)"/><use href="#fl"/></svg><div class="box"></div></div>
<header class="top"><h1 id="ttl">Home Dashboard</h1>
<button class="burger" id="bg" aria-label="Open menu"><i></i><i></i><i></i><span class="dot" id="dot"></span></button></header>
<div class="ov" id="ov"></div>

<script>
var D={tx:[],budget:0,wa:'',biz:'My Business',pw:'',fails:[],fc:0,lock:0,alertWA:{phone:'',key:''},pend:[],al:{},gen:'',
msgs:{confirm:'Assalam o Alaikum {name}! Your order for {item} is confirmed. Total: Rs {total}. Advance received: Rs {advance}. Balance: Rs {balance}. Thank you! - {biz}',ready:'Assalam o Alaikum {name}! Your order for {item} is ready. Balance to pay: Rs {balance}. - {biz}',remind:'Assalam o Alaikum {name}, a gentle reminder: Rs {balance} is pending for {item}. Please pay when convenient. Thank you! - {biz}'},
prof:{name:'',phone:'',photo:''},L:{rcpt:[],cust:[],orders:[],check:[],groc:[],goals:[],bc:[],cost:[],inv:[],udh:[],invo:[]}};
function copy(o){return JSON.parse(JSON.stringify(o))}
var S=load();
function load(){var s=copy(D);try{var x=JSON.parse(localStorage.getItem('met3')||'null');if(!x){var o=JSON.parse(localStorage.getItem('met2')||'null');if(o){x={tx:o.tx,budget:o.budget,wa:o.wa,biz:o.biz,msgs:o.msgs,L:{orders:o.orders}}}}
if(x){for(var k in x){if(x[k]!=null&&k!=='L'&&k!=='msgs')s[k]=x[k]}if(x.msgs)Object.assign(s.msgs,x.msgs);if(x.L)Object.assign(s.L,x.L)}}catch(e){}
if(!s.L.cust.length&&s.L.orders.length){var sn={};s.L.orders.forEach(function(o){var k=String(o.name||'').toLowerCase();if(k&&!sn[k]){sn[k]=1;s.L.cust.push({id:uid(),name:o.name,phone:o.phone||'',city:o.city||'',note:''})}})}
for(var lk in s.L)s.L[lk].forEach(function(o){if(o&&typeof o==='object'&&!o.id)o.id=uid()});
return s}
function save(){try{localStorage.setItem('met3',JSON.stringify(S));return true}catch(e){return false}}
var $=function(i){return document.getElementById(i)};
function rs(n){return 'Rs '+Math.round(n||0).toLocaleString('en-PK')}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function nm(v){return parseFloat(v)||0}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function mk(){return new Date().toISOString().slice(0,7)}
function today(){return new Date().toISOString().slice(0,10)}
function bal(o){return Math.max(0,nm(o.total)-nm(o.adv))}
function ask(t){var v=prompt(t);if(v===null)return null;v=parseFloat(v);return isNaN(v)||v<0?null:v}
/* ---------- security ---------- */
function hash(p){if(window.crypto&&crypto.subtle&&window.TextEncoder){return crypto.subtle.digest('SHA-256',new TextEncoder().encode('met|'+p)).then(function(h){return Array.from(new Uint8Array(h)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')})}var h=5381;for(var i=0;i<p.length;i++)h=((h<<5)+h+p.charCodeAt(i))|0;return Promise.resolve('d'+h)}
function lgErr(i){var a=i.closest('.arch');(a||i).remove()}
function showAuth(){var c=!S.pw,a=$('auth');$('fab').style.display='none';a.style.display='flex';
a.querySelector('.box').innerHTML='<div class="bis">بسم اللہ الرحمن الرحیم</div><div class="arch"><img class="lg" src="logo.png" alt="Logo" onerror="lgErr(this)"></div><h1 class="sc">Home &amp; Business</h1><div class="orn"><i></i><span>◆</span><i></i></div><div class="kp">kept apart</div><div class="fm">'+(c?'<label for="p1">Create your password</label><input id="p1" type="password" autocomplete="new-password" placeholder="At least 4 characters"><label for="p2">Type it again</label><input id="p2" type="password" autocomplete="new-password" placeholder="Same password">':'<label for="p1">Password</label><input id="p1" type="password" autocomplete="current-password" placeholder="Enter your password">')+'<div class="err" id="er"></div><button class="btn" id="go">'+(c?'Create Password':'Login')+'</button>'+(c?'':'<div class="fg"><a href="#" id="fgp">Forgot password?</a></div>')+'</div>';
$('go').onclick=doAuth;a.querySelectorAll('input').forEach(function(i){i.onkeydown=function(e){if(e.key==='Enter')doAuth()}});if($('fgp'))$('fgp').onclick=function(e){e.preventDefault();showReset(1)};$('p1').focus()}
function doAuth(){var p=$('p1').value,er=$('er');
if(!S.pw){if(p.length<4){er.textContent='Password must have at least 4 characters.';return}if(p!==$('p2').value){er.textContent='The two passwords do not match.';return}hash(p).then(function(h){S.pw=h;save();unlock()})}
else{var lk=S.lock-Date.now();if(lk>0){er.textContent='Too many wrong tries. Please wait '+Math.ceil(lk/1000)+' seconds.';return}
hash(p).then(function(h){if(h===S.pw){S.fc=0;save();unlock()}else{S.fails.push(Date.now());if(S.fails.length>20)S.fails.shift();S.fc=(S.fc||0)+1;if(S.fc===1)waAlert('Wrong password alert: someone just entered a wrong password on your Home and Business app. '+new Date().toLocaleString());if(S.fc>=5)waAlert('Wrong password alert: 5 wrong tries in a row. The app is locked for 1 minute. '+new Date().toLocaleString());if(S.fc>=5){S.lock=Date.now()+60000;S.fc=0;er.textContent='Too many wrong tries. Please wait 60 seconds.'}else er.textContent='Wrong password. Please try again.';save()}})}}
function waSend(t){var a=S.alertWA||{};if(!a.phone||!a.key)return false;try{fetch('https://api.callmebot.com/whatsapp.php?phone='+encodeURIComponent(a.phone)+'&text='+encodeURIComponent(t)+'&apikey='+encodeURIComponent(a.key),{mode:'no-cors'}).catch(function(){})}catch(e){}return true}
function waAlert(t){waSend(t)}
function waCard(){var a=S.alertWA||{},ph=a.phone||(S.prof.phone?'+'+intl(S.prof.phone):'');return '<div class="card"><h3>Wrong password alert on WhatsApp</h3><p class="hint">When someone enters a wrong password, a message is sent to your WhatsApp. It uses the free CallMeBot service and needs internet.</p><ol class="hint" style="padding-left:18px;margin:8px 0"><li>Save the CallMeBot WhatsApp number in your contacts. Get the current number from the CallMeBot website (search for "CallMeBot WhatsApp API").</li><li>Send it this message: I allow callmebot to send me messages</li><li>It replies with your API key. Type it below.</li></ol><label for="wp">Your WhatsApp number (with country code)</label><input id="wp" type="tel" value="'+esc(ph)+'" placeholder="+923001234567"><label for="wk">CallMeBot API key</label><input id="wk" value="'+esc(a.key||'')+'" placeholder="e.g. 123456"><button class="btn" onclick="saveWA()">Save Alert Settings</button><button class="btn ghost" onclick="testWA()">Send Test Message</button></div>'}
function saveWA(q){var p=$('wp').value.trim();if(p&&p.charAt(0)!=='+')p='+'+intl(p);S.alertWA={phone:p,key:$('wk').value.trim()};$('wp').value=p;save();if(!q)alert('Saved.')}
function testWA(){saveWA(1);if(!waSend('Test message from your Home and Business app. Wrong password alerts are working.')){alert('Please enter your WhatsApp number and the CallMeBot API key first.');return}alert('Test sent. Check your WhatsApp in a minute. If nothing arrives, check the number and API key.')}
function showReset(st){var a=$('auth').querySelector('.fm'),h='';
if(st===1){h=S.prof.phone?'<label for="rn">Enter your personal number (saved in My Profile)</label><input id="rn" type="tel" placeholder="03XXXXXXXXX"><div class="err" id="er"></div><button class="btn" id="rv">Verify</button>':'<p class="hint">No personal number is saved in My Profile, so the password cannot be reset. You can erase everything and start again.</p><button class="btn red" id="rw">Erase Everything and Start Again</button>';h+='<div class="fg"><a href="#" id="rb">Back to login</a></div>'}
else h='<label for="n1">New password</label><input id="n1" type="password" autocomplete="new-password" placeholder="At least 4 characters"><label for="n2">Type it again</label><input id="n2" type="password" autocomplete="new-password" placeholder="Same password"><div class="err" id="er"></div><button class="btn" id="rs">Set New Password</button>';
a.innerHTML=h;
if($('rb'))$('rb').onclick=function(e){e.preventDefault();showAuth()};

function mtx(){return S.tx.filter(function(t){return t.sp!=='b'&&t.d.slice(0,7)===mk()})}
function sums(){var i=0,e=0;mtx().forEach(function(t){t.t==='in'?i+=t.a:e+=t.a});return{i:i,e:e}}

/* ---------- alerts ---------- */
function getAl(){var a=[],m=mk(),s=sums(),L=S.L;
if(S.budget>0&&s.e>S.budget)a.push({id:'bud'+m,n:'Budget Finished Alert',m:'You have spent '+rs(s.e)+' but your monthly budget is '+rs(S.budget)+'.',go:'budget',gl:'Open Monthly Budget'});
L.check.forEach(function(o){if(o.paid!==m)a.push({id:'chk'+o.id+m,n:'Monthly Bill Due Alert',m:o.name+' is not marked paid this month.',go:'check',gl:'Open Bills Checklist'})});
L.orders.forEach(function(o){if(bal(o)>0)a.push({id:'ord'+o.id+Math.round(bal(o)),n:'Payment Pending Alert',m:o.name+' still owes '+rs(bal(o))+' for '+o.item+'.',go:'orders',gl:'Open Customer Orders'})});
L.udh.forEach(function(o){if(nm(o.amt)>0)a.push({id:'udh'+o.id+Math.round(o.amt),n:'Client Payment Due Alert',m:o.name+' still needs to pay you '+rs(o.amt)+'.',go:'udh',gl:'Open Pending Payments'})});
L.inv.forEach(function(o){if(nm(o.qty)<=nm(o.min))a.push({id:'inv'+o.id+o.qty,n:'Low Stock Alert',m:o.name+' is running low: '+o.qty+' '+(o.unit||'')+' left.',go:'inv',gl:'Open Raw Material Stock'})});
if(nPe())a.push({id:'pen'+m+nPe(),n:'Approvals Waiting Alert',m:nPe()+' automatic item(s) need your approval.',go:'pend',gl:'Open Pending Approvals'});
if(S.fails.length){var lf=S.fails[S.fails.length-1];a.push({id:'fail'+lf,n:'Wrong Password Alert',m:'Someone entered a wrong password '+S.fails.length+' time(s). Last try: '+new Date(lf).toLocaleString()+'.',go:'set',gl:'Open Settings and Security'})}
return a.filter(function(x){return !S.al[x.id]})}

var F={};
F.dash=function(){var s=sums(),h='',n=nAl(),cat={};
mtx().forEach(function(t){if(t.t==='out')cat[t.c]=(cat[t.c]||0)+t.a});
if(S.budget>0&&s.e>S.budget)h+='<div class="alert"><b>Budget Finished Alert</b>You spent '+rs(s.e)+' of your '+rs(S.budget)+' budget.<div class="acts"><button class="btn sm red" onclick="go(\'budget\')">Open Monthly Budget</button></div></div>';
else if(s.i>s.e&&s.i>0)h+='<div class="news"><b class="good">Good news:</b> you are in profit this month by '+rs(s.i-s.e)+'.</div>';
var top=Object.keys(cat).sort(function(a,b){return cat[b]-cat[a]})[0];
if(top)h+='<div class="card"><h3>What happened this month</h3><p>Your biggest spending is <b>'+esc(top)+'</b> at '+rs(cat[top])+' ('+Math.round(cat[top]/s.e*100)+'% of all spending).</p></div>';
if(n)h+='<div class="alert"><b>'+n+' alert(s) need attention</b><div class="acts"><button class="btn sm red" onclick="go(\'alerts\')">Open Alerts</button></div></div>';
h+='<div class="grid"><div class="stat"><small>Income this month</small><b class="good">'+rs(s.i)+'</b></div><div class="stat"><small>Spent this month</small><b class="bad">'+rs(s.e)+'</b></div><div class="stat full"><small>Left over</small><b>'+rs(s.i-s.e)+'</b></div></div>';
h+='<div class="card"><h3>Recent entries</h3>';var l=S.tx.map(function(t,i){return{t:t,i:i}}).filter(function(x){return x.t.sp!=='b'}).reverse().slice(0,15);
if(!l.length)h+=empty('No entries yet.','Add first entry','addh');
l.forEach(function(x){var t=x.t;h+='<div class="row"><div class="rt"><div class="l"><b>'+esc(t.c)+'</b><small>'+esc(t.n||'No note')+' • '+t.d+'</small></div><div class="r '+(t.t==='in'?'good':'bad')+'">'+(t.t==='in'?'+':'-')+rs(t.a)+'</div></div><div class="acts"><button class="btn sm red" onclick="delTx('+x.i+')">Delete Entry</button></div></div>'});
return h+'</div>'};

F.zakat=function(){var f=[['z1','Cash and bank savings'],['z2','Gold and silver value'],['z3','Business stock and goods'],['z4','Money others owe you'],['z5','Debts you must pay'],['z6','Nisab value (silver, 612.36 grams)']],h='<div class="card"><h3>Your wealth (Rs)</h3>';

return h+'<p class="hint" id="zn"></p><button class="btn sm ghost" style="margin-top:8px" onclick="loadNisab()">Check Silver Rate Again</button><button class="btn" onclick="calcZ()">Calculate Zakat</button><div id="zr" style="margin-top:12px"></div></div>'};
function loadNisab(){var z=$('zn'),inp=$('z6');if(!z||!inp)return;
if(S.nisab&&S.nisab.v){inp.value=S.nisab.v;z.textContent='Last checked on '+S.nisab.d+': about '+rs(S.nisab.v)+'. Checking today\'s rate...'}else z.textContent='Checking today\'s silver rate...';
function tm(u){return Promise.race([fetch(u).then(function(r){if(!r.ok)throw 0;return r.json()}),new Promise(function(_,j){setTimeout(j,8000)})])}
Promise.all([tm('https://api.gold-api.com/price/XAG'),tm('https://open.er-api.com/v6/latest/USD')]).then(function(r){var oz=nm(r[0].price),pk=r[1].rates&&nm(r[1].rates.PKR);if(!(oz>0&&pk>0))throw 0;var v=Math.round(612.36*oz/31.1035*pk);S.nisab={v:v,d:today()};save();
if($('z6')){$('z6').value=v;$('zn').textContent='Silver nisab (612.36 grams) is about '+rs(v)+' today. It is worked out from the international silver price and the dollar rate. Local shop rates can differ a little, so you can change the number.'}})
.catch(function(){if($('zn'))$('zn').textContent=(S.nisab&&S.nisab.v?'Could not check today\'s rate (no internet?). Showing the last checked value from '+S.nisab.d+'. ':'Could not check the silver rate (no internet?). Please type the nisab value yourself. ')+'Silver nisab is 612.36 grams.'})}
function calcZ(){var w=nm($('z1').value)+nm($('z2').value)+nm($('z3').value)+nm($('z4').value)-nm($('z5').value),n=nm($('z6').value);
$('zr').innerHTML=w<=0?'<p>Your net wealth is '+rs(w)+'. No Zakat to pay.</p>':n>0&&w<n?'<p>Net wealth '+rs(w)+' is below the nisab '+rs(n)+'. No Zakat is due.</p>':'<div class="news">Net wealth: <b>'+rs(w)+'</b><br>Zakat due (2.5%): <b>'+rs(w*0.025)+'</b></div><p class="hint">Please confirm with a scholar for your situation.</p>'}

var bl=S.tx.map(function(t,i){return{t:t,i:i}}).filter(function(x){return x.t.sp==='b'}).reverse().slice(0,10);
h+='<div class="card"><h3>Business spending</h3>'+(bl.length?bl.map(function(x){return '<div class="row"><div class="rt"><div class="l"><b>'+esc(x.t.c)+'</b><small>'+esc(x.t.n)+' • '+x.t.d+'</small></div><div class="r bad">'+rs(x.t.a)+'</div></div><div class="acts"><button class="btn sm red" onclick="delTx('+x.i+')">Delete Entry</button></div></div>'}).join(''):'<div class="empty">No business spending yet. Open Add Expense in the menu to add one.</div>')+'</div>';return h};

var a=amtOf(t);SC.a=a?Math.round(a):'';
var lab=hit?(DEST.filter(function(x){return x[0]===hit[1]})[0]||[0,''])[1]:'';
SC.msg=(hit?'This looks like: '+lab+(hit[2]?' ('+hit[2]+')':'')+'. ':'I could not tell where this belongs. Please choose below. ')+(a?'Amount found: '+rs(a)+'. ':'I could not find the amount. Please type it. ')+'Check, change if needed, then approve.';sheet(2)}
function saveSc(){var a=nm($('sa').value),n=$('sn').value.trim(),d=$('sd').value;if(a<=0){alert('Please enter an amount greater than 0.');return}
var to='dash';
if(d.indexOf('h:')===0){addTx('out',d.slice(2),a,n)}
else if(d==='bill'){var bn=$('sb').value,o=S.L.check.filter(function(x){return x.name===bn})[0];if(!o){o={id:uid(),name:bn,amt:a};S.L.check.push(o);genPend()}o.amt=a;settle('check',o);to='check'}
else if(d==='biz'){addTx('out','Business supplies',a,n,'b');to='bdash'}
else if(d==='ord'){var so=$('so');if(!so){alert('Please add an order first, or choose another place.');return}var od=S.L.orders[parseInt(so.value,10)];od.adv=nm(od.adv)+a;var rr={id:uid(),name:od.name,amt:a,date:today(),note:n,img:SC.img||'',oid:od.id,ol:od.item};S.L.rcpt.push(rr);if(!save()){rr.img='';save()}to='orders'}
save();closeSc();go(to)}

h+='<label for="rca">Amount paid (Rs)</label><input id="rca" type="number" inputmode="decimal" min="0"><label for="rcd">Date</label><input id="rcd" type="date" value="'+today()+'"><label for="rcm">Note (optional)</label><input id="rcm" placeholder="e.g. Easypaisa, bank transfer, cash">';

h+='<label id="rcw" style="display:none;align-items:center;gap:8px;margin-top:14px;color:var(--ink)"><input type="checkbox" id="rck" checked style="width:auto"> Also add this amount to the order\'s payment</label><button class="btn" onclick="saveRc()">Save Receipt</button></div><div class="card"><h3>Receipts log</h3>';
if(!S.L.rcpt.length)h+='<div class="empty">No receipts yet. Add the first one above.</div>';
S.L.rcpt.map(function(r,i){return{r:r,i:i}}).reverse().forEach(function(x){var r=x.r;h+='<div class="row"><div class="rt">'+(r.img?'<img src="'+r.img+'" alt="Receipt" style="width:58px;height:58px;object-fit:cover;border-radius:10px;flex:none;cursor:pointer" onclick="viewRc('+x.i+')">':'')+'<div class="l"><b>'+esc(r.name)+'</b><small>'+r.date+(r.ol?' - for '+esc(r.ol):'')+(r.note?' - '+esc(r.note):'')+'</small></div><div class="r good">'+rs(r.amt)+'</div></div><div class="acts">'+(r.img?'<button class="btn sm ghost" onclick="viewRc('+x.i+')">View Photo</button>':'')+'<button class="btn sm red" onclick="delRc('+x.i+')">Delete</button></div></div>'});
return h+'</div>'};

function rcPhoto(inp){var f=inp.files&&inp.files[0];if(!f)return;var im=new Image();im.onerror=function(){alert('Could not open that photo. Please try another.')};
im.onload=function(){var k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);RC.img=c.toDataURL('image/jpeg',.6);$('rpv').innerHTML='<img class="pv" src="'+RC.img+'" alt="Receipt photo"><div class="acts" style="justify-content:center"><button class="btn sm red" onclick="RC.img=\'\';$(\'rpv\').innerHTML=\'\'">Remove Photo</button></div>'};im.src=URL.createObjectURL(f)}

/* ---------- PDF export ---------- */
function pSafe(t){return String(t==null?'':t).replace(/[\u2018\u2019]/g,"'").replace(/[\u201c\u201d]/g,'"').replace(/[\u2013\u2014]/g,'-').replace(/\u2022/g,'-').replace(/[^\x20-\x7e\xa0-\xff]/g,'?')}
function pEsc(t){return pSafe(t).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)')}
function pWrap(t,n){var w=pSafe(t).split(/\s+/),l=[],c='';w.forEach(function(x){while(x.length>n){if(c){l.push(c);c=''}l.push(x.slice(0,n));x=x.slice(n)}if(!c)c=x;else if((c+' '+x).length<=n)c+=' '+x;else{l.push(c);c=x}});if(c)l.push(c);return l}
function pdfBytes(pages,foot){var W=595,H=842;var n=pages.length,objs=[],kids=[];
objs.push('<< /Type /Catalog /Pages 2 0 R >>');
for(var i=0;i<n;i++)kids.push((6+2*i)+' 0 R');
objs.push('<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+n+' >>');
['Helvetica','Helvetica-Bold','Courier'].forEach(function(f){objs.push('<< /Type /Font /Subtype /Type1 /BaseFont /'+f+' /Encoding /WinAnsiEncoding >>')});
pages.forEach(function(p,i){if(foot)p.push('BT /F1 8 Tf 0.45 0.42 0.52 rg '+(W/2-30)+' 22 Td (Page '+(i+1)+' of '+n+') Tj ET');var c=p.join('\n');
objs.push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /Font << /F1 3 0 R /F2 4 0 R /F3 5 0 R >> >> /Contents '+(7+2*i)+' 0 R >>');
objs.push('<< /Length '+c.length+' >>\nstream\n'+c+'\nendstream')});
var out='%PDF-1.4\n',offs=[];objs.forEach(function(b,i){offs.push(out.length);out+=(i+1)+' 0 obj\n'+b+'\nendobj\n'});
var xr=out.length;out+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n';offs.forEach(function(o){out+=('0000000000'+o).slice(-10)+' 00000 n \n'});
out+='trailer\n<< /Size '+(objs.length+1)+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF';
var by=new Uint8Array(out.length);for(var k=0;k<out.length;k++)by[k]=out.charCodeAt(k)&255;
return by}
function dlBytes(by,name){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([by],{type:'application/pdf'}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
function exportPdf(){
var W=595,H=842,M=40,CW=5.4,NC=Math.floor((W-2*M)/CW),pages=[],cur,y;
function np(){cur=[];pages.push(cur);y=H-M}
function need(h){if(!cur||y-h<M+24)np()}
function put(f,sz,x,t,col){cur.push('BT /'+f+' '+sz+' Tf '+(col||'0.23 0.21 0.31')+' rg '+x.toFixed(1)+' '+y.toFixed(1)+' Td ('+pEsc(t)+') Tj ET')}
function h1(t){need(60);put('F2',20,M,t,'0.64 0.28 0.36');y-=24}
function line(t){need(14);put('F3',9,M,t);y-=13}
function h2(t){need(50);y-=10;cur.push('0.98 0.88 0.92 rg '+M+' '+(y-5).toFixed(1)+' '+(W-2*M)+' 20 re f');put('F2',12,M+8,t,'0.64 0.28 0.36');y-=24}
function rec(a,r,d){need(30);var ta=pSafe(a),tr=pSafe(r||'');ta=ta.length>NC-tr.length-2?ta.slice(0,NC-tr.length-5)+'...':ta;put('F3',9,M,ta);if(tr)put('F3',9,W-M-tr.length*CW,tr);y-=12;if(d)pWrap(d,NC-4).forEach(function(l){need(12);put('F3',8,M+14,l,'0.45 0.42 0.52');y-=11});y-=4}
function none(){line('Nothing saved yet.');y-=4}
var P=S.prof,s=sums(),L=S.L,txh=S.tx.filter(function(t){return t.sp!=='b'}).slice().reverse(),txb=S.tx.filter(function(t){return t.sp==='b'}).slice().reverse();
np();h1('My Expense Tracker');
line('Full data report - '+today());if(P.name)line('Name: '+P.name);if(P.phone)line('Personal number: '+P.phone);line('Business: '+S.biz);
h2('Home - this month');rec('Income',rs(s.i));rec('Spent',rs(s.e));rec('Left over',rs(s.i-s.e));if(S.budget>0)rec('Monthly budget',rs(S.budget));
h2('Home - all income and expenses');if(!txh.length)none();txh.forEach(function(t){rec(t.d+'  '+t.c,(t.t==='in'?'+':'-')+rs(t.a),t.n)});
var rev=0,adv=0,pen=0,ud=0,bx=0;L.orders.forEach(function(o){rev+=nm(o.total);adv+=nm(o.adv);pen+=bal(o)});L.udh.forEach(function(o){ud+=nm(o.amt)});txb.forEach(function(t){bx+=t.a});
h2('Business - summary');rec('Total orders',String(L.orders.length));rec('Total sales',rs(rev));rec('Money received',rs(adv));rec('Still to receive',rs(pen));rec('Pending client payments',rs(ud));rec('Business spending',rs(bx));
h2('Business - customer orders');if(!L.orders.length)none();L.orders.forEach(function(o){rec(o.name+' - '+o.item,rs(o.total),'Payment: '+(bal(o)>0?'Balance '+rs(bal(o))+' pending (paid '+rs(o.adv)+')':'Paid in full')+' | Delivery: '+(o.done?'Delivered':'Not delivered yet')+(o.city?' | '+o.city:'')+(o.phone?' | '+o.phone:''))});
h2('Business - spending');if(!txb.length)none();txb.forEach(function(t){rec(t.d+'  '+t.c,rs(t.a),t.n)});
h2('Clients info');if(!L.cust.length)none();L.cust.forEach(function(c){rec(c.name,c.phone||'',[c.city,c.note].filter(Boolean).join(' | '))});
h2('Pending payments from clients');if(!L.udh.length)none();L.udh.forEach(function(o){rec(o.name,nm(o.amt)>0?rs(o.amt):'Paid',[o.note,o.phone].filter(Boolean).join(' | '))});
h2('Monthly bills checklist');if(!L.check.length)none();L.check.forEach(function(o){rec(o.name,rs(o.amt),o.paid===mk()?'Paid this month':'Not paid this month')});
h2('Monthly grocery list');if(!L.groc.length)none();L.groc.forEach(function(o){rec(o.name,rs(o.amt),o.qty)});
h2('Savings goals');if(!L.goals.length)none();L.goals.forEach(function(o){rec(o.name,rs(o.saved)+' of '+rs(o.target))});
h2('Committee');if(!L.bc.length)none();L.bc.forEach(function(o){rec(o.name,rs(o.amt)+' x '+o.mem,'Your turn: month '+o.turn)});
h2('Product costing');if(!L.cost.length)none();L.cost.forEach(function(o){var c=cost(o);rec(o.name,'Profit '+rs(nm(o.price)-c),'Cost '+rs(c)+' | Selling price '+rs(o.price))});
h2('Raw material stock');if(!L.inv.length)none();L.inv.forEach(function(o){rec(o.name,o.qty+' '+(o.unit||''),'Alert below '+o.min)});
h2('Invoices');if(!L.invo.length)none();L.invo.forEach(function(o){rec(o.name+' - '+o.item,rs(o.amt),o.date+' | '+(o.paid?'Paid':'Unpaid'))});
h2('Payment receipts log');if(!L.rcpt.length)none();L.rcpt.slice().reverse().forEach(function(r){rec(r.date+'  '+r.name,rs(r.amt),[r.ol?'For: '+r.ol:'',r.note,r.img?'Receipt photo saved in the app':'No photo'].filter(Boolean).join(' | '))});
var by=pdfBytes(pages,true);dlBytes(by,'my-expense-tracker-data.pdf')}
